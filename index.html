<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Deneme Sayfası</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #0d1117;
      color: #c9d1d9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 32px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }

    h1 {
      color: #58a6ff;
      margin-bottom: 12px;
      font-size: 1.6rem;
    }

    p {
      color: #8b949e;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .btn {
      background-color: #238636;
      color: #ffffff;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover {
      background-color: #2ea043;
    }

    .status-badge {
      display: inline-block;
      margin-top: 20px;
      padding: 4px 12px;
      border-radius: 20px;
      background-color: #1f2937;
      color: #3fb950;
      font-size: 0.85rem;
      border: 1px solid #238636;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>🚀 Merhaba GitHub!</h1>
    <p>Bu sayfa GitHub Pages denemesi için hazırlanmış temel bir HTML5 şablonudur.</p>
    
    <button class="btn" onclick="testClick()">Tıkla ve Test Et</button>
    
    <div id="status" class="status-badge">Durum: Yayında</div>
  </div>

  <script>
    function testClick() {
      const status = document.getElementById('status');
      status.innerText = "JavaScript sorunsuz çalışıyor! ✅";
      status.style.borderColor = "#58a6ff";
      status.style.color = "#58a6ff";
    }
  </script>

</body>
</html>
